<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Django Auth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .error-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 72px;
            color: #dc3545;
            margin-bottom: 10px;
            font-weight: 900;
        }
        
        h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .error-details {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 13px;
            color: #666;
        }
        
        .error-details strong {
            color: #333;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 56px;
            }
            
            h2 {
                font-size: 20px;
            }
            
            .error-icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="error-icon">🔍</span>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>
            Oops! The page you're looking for doesn't exist.
        </p>
        <p style="font-size: 14px; color: #888;">
            Ho sakta hai ke URL galat ho ya page move kar diya gaya ho.
        </p>
        
        <a href="{% url 'login' %}" class="btn">
            🏠 Go to Login
        </a>
        
        <div class="error-details">
            <strong>💡 Tip:</strong>
            <br>
            Check ke URL sahi hai ya nahi. Agar aapko lagta hai ke yeh error galat hai, toh admin se contact karein.
        </div>
    </div>
</body>
</html>
