<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Password Reset</title>
</head>
<body>
    <h2>Reset Your Password</h2>
    {% if validlink %}
        <p>Enter your new password below.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Reset Password</button>
        </form>
    {% else %}
        <p style="color: red;">The password reset link is invalid or has expired.</p>
        <p><a href="{% url 'password_reset' %}">Request a new password reset</a></p>
    {% endif %}
</body>
</html>
